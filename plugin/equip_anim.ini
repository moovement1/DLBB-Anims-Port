; equip_anim.asi — weapon equip animations for Dying Light 1
[General]
; 0 = plugin does nothing
Enabled=1
; writes equip_anim.log next to the .asi (signatures found, every weapon switch and the track played)
Log=1
; state requested on weapon switch; the game plays "Fpp_<weapon AnimPrefix>_<AnimName>"
AnimName=Show
; 1 = like Bad Blood: no lower/raise of the weapon, it is swapped at once and the equip anim brings it up
; 0 = vanilla lower/raise, the equip anim plays when the new weapon appears
InstantSwitch=1
; AnimPrefix values (data\scripts\inventory) that have a Show track; only these switch instantly
InstantPrefixes=knife,stick,stick2close,stick2heavy,gnome,beretta,schofield,sixshooter,walker,singleshot,shotgun,shotgun_pa,shotgun_sa,m16,ak47,railgun,grenadelauncher,chainsaw,submachinegun,submachinegun_alt,crossbow,bow,fist,fistinfection,shield
; 1 = like Bad Blood: the Show plays on both arm tracks (needed unless MainTrack=1)
HandTracks=1
; 0 = like Bad Blood: camera, body and jump/landing keep the game's own animation during the Show
; 1 = the Show also drives the main track (v4/v5 behaviour: moves the camera slightly)
MainTrack=0
; 1 = like Bad Blood: attack/aim presses are ignored while the Show plays
BlockAttacks=1
; 1 = hold attack with a light weapon (knife, one-handed, two-handed close) works without the skill
UnlockCharge=1
; 1 = hold attack with a heavy two-handed weapon works without the skill
UnlockWhirlwind=1
; 1 = head stomp on a lying enemy works without the skill
UnlockStomp=1
; 1 = attack while falling on an enemy works without the skill (with the mod's data: Bad Blood's drop attack, landing on
; the enemy and kicking it away; data built with --no-drop-attack: Dying Light's stab or head crush)
UnlockJumpAttack=1
; 1 = ground pound with a heavy two-handed weapon works without the skill
UnlockGroundPound=1
; height above the ground needed for the ground pound, in metres: 3.0 = Bad Blood, 1.1 = Dying Light, 0 = keep the game's
GroundPoundMinHeight=3.0
; 1 = attack while falling: one click in the air is enough; 0 = the button must stay down until the contact with the enemy
JumpAttackClick=1
; 1 = writes each step of the attack while falling to equip_anim.log
JumpAttackLog=1
; 1 = like Bad Blood: during the attack while falling the camera follows the enemy (looks down at it, then
; follows it when it is kicked away); 0 = leave the camera to the game (it looks straight ahead)
JumpAttackCamera=1
; seconds after the landing when the camera is given back (the zombie is still sliding at 1.5), 0 = at the end
JumpAttackCameraTime=1.5
; 1 = the impact of the attack while falling blows the zombie's head off, 0 = only with the skill the game asks for
JumpAttackHead=1
; equip animations longer than this (seconds) are ignored
MaxDuration=3.0
